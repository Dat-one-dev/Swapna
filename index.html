<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Swapna</title>
</head>
<body>
    <header class="header">
        <div class="headertitle">
            <h1>SWAPNA</h1>
        </div>
        <div class="toolbar">
            <button id="regenerateBtn">
                <span class="toolicon">↻</span>
                <span class="toolTag">Regenerate<br>Palette</span>
            </button>
            <button class="header-action" id="downloadBtn">
                <span class="toolicon">▤</span>
                <span class="toolTag">Download<br>Palette</span>
            </button>
        </div>
    </header>
    <main class="workspace">
        <div class="palette">
            <div class="widget-title">
                <span>PALETTE</span>
            </div>

            <div class="palette-colors">
                <div class="color-item">
                    <div class="color-swatch" style="background: #C5B0F3;"></div>
                    <span>#C5B0F3</span>
                </div>

                <div class="color-item">
                    <div class="color-swatch" style="background: #71449D;"></div>
                    <span>#71449D</span>
                </div>

                <div class="color-item">
                    <div class="color-swatch" style="background: #9B7AC7;"></div>
                    <span>#9B7AC7</span>
                </div>

                <div class="color-item">
                    <div class="color-swatch" style="background: #181B20;"></div>
                    <span>#181B20</span>
                </div>

                <div class="color-item">
                    <div class="color-swatch" style="background: #FFFFFF;"></div>
                    <span>#FFFFFF</span>
                </div>
            </div>
        </div>
        <div class="colorpicker">
            <div class="widget-title">
                <span>COLOR PICKER</span>
            </div>
            <div class="picker-body">
                <div class="color-area">
                    <div class="color-selector">

                    </div>
                </div>
                <input
                    type="range"
                    id="hueSlider"
                    min="0"
                    max="360"
                    value="258"
                >

                <div class="color-info">

                    <div class="selected-color" id="selectedColor"></div>

                    <div class="color-values">

                        <div class="value-row">
                            <span>HEX</span>

                            <div class="value-control">
                                <input
                                    id="hexValue"
                                    value="#C5B0F3"
                                >
                                <button class="copy-btn" data-copy="hexValue">
                                    COPY
                                </button>
                            </div>
                        </div>

                        <div class="value-row">
                            <span>RGB</span>

                            <div class="value-control">
                                <input
                                    id="rgbValue"
                                    value="197, 176, 243"
                                    readonly
                                >
                                <button class="copy-btn" data-copy="rgbValue">
                                    COPY
                                </button>
                            </div>
                        </div>

                        <div class="value-row">
                            <span>HSL</span>

                            <div class="value-control">
                                <input
                                    id="hslValue"
                                    value="258, 76%, 82%"
                                    readonly
                                >
                                <button class="copy-btn" data-copy="hslValue">
                                    COPY
                                </button>
                            </div>
                        </div>

                        <div class="value-row">
                            <span>HSV</span>

                            <div class="value-control">
                                <input
                                    id="hsvValue"
                                    value="258, 28%, 95%"
                                    readonly
                                >
                                <button class="copy-btn" data-copy="hsvValue">
                                    COPY
                                </button>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
